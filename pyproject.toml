[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "shopify-theme-audit"
version = "0.1.0"
description = "CLI tooling to fingerprint Shopify storefronts and infer likely themes with optional AI summarization."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Shift8" }
]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "httpx>=0.28.1,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10"
]

[project.scripts]
shopify-theme-audit = "shopify_theme_audit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/shopify_theme_audit"]